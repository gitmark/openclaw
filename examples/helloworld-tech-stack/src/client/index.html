<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Tech Stack Demo</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
    </style>

  <body>

      Lit Web Component: Custom element that encapsulates all UI logic
      The component is defined in components/chat-app.ts
    -->

      Vite: Automatically processes this module script
      It handles TypeScript compilation, module bundling, and hot module replacement (HMR)
    -->
    <script type="module" src="/main.ts"></script>
  </body>
</html>
